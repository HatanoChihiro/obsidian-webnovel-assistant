name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for artifact attestations
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation for main.js
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "main.js"

      - name: Generate artifact attestation for styles.css
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "styles.css"

      - name: Generate artifact attestation for manifest.json
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "manifest.json"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
